[project]
name = "harness-tools"
version = "0.1.0"
description = "Harness et Tool Calling construits à la main en Python, avec banc d'évaluation et comparatif"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
frameworks = [
    "smolagents>=1.0.0",
    "pydantic-ai>=0.0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
